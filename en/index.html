<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#52d670">
<title>Playtimer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one calm full-screen color field; status on top, big time in the middle, the slider as the hero, one action at the bottom.
   Single-theme by choice: the background color IS the timer, so it never follows the system theme. */
:root {
  --ink: #1d2b25;
  --ink-soft: rgba(29, 43, 37, 0.68);
  --field: hsl(134, 62%, 58%);      /* updated by script: one solid color per zone */
  --done: hsl(268, 60%, 74%);
  --track: rgba(255, 255, 255, 0.42);
  --fill: rgba(255, 255, 255, 0.92);
  --glow: rgba(255, 255, 255, 0.95);
  --btn: #1d2b25;
  --btn-ink: #f6fbf8;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { overflow-y: auto !important; }
body {
  background: var(--field);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  transition: background-color 4s ease-in-out;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
body.is-done { background: var(--done); }

.app {
  position: relative;
  z-index: 1;
  min-height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-areas: "status" "clock" "slider" "actions";
  align-content: space-evenly;
  justify-items: stretch;
  gap: clamp(16px, 4vmin, 36px);
  padding-block: clamp(16px, 4vmin, 40px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}
.status { grid-area: status; }
.clock { grid-area: clock; }
.slider-wrap { grid-area: slider; }
.actions { grid-area: actions; }

/* Sideways phone: big time on the left, everything else on the right */
@media (orientation: landscape) {
  .app {
    max-width: 1100px;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "clock status" "clock slider" "clock actions";
    align-content: center;
    column-gap: clamp(24px, 5vw, 64px);
  }
  .clock .big { font-size: clamp(4rem, min(17vw, 34vh), 13rem) !important; }
}

/* Status message */
.status { display: grid; gap: 0.3em; align-content: start; }
.status h1 {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.7rem, 7.5vmin, 3.2rem);
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}
.status p { margin: 0; color: var(--ink); opacity: 0.82; font-size: clamp(1.1rem, 4.6vmin, 1.9rem); line-height: 1.3; text-wrap: balance; }

/* Big time */
.clock { display: grid; place-content: center; text-align: center; gap: 0.4em; }
.clock .big {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(4.5rem, min(30vw, 17vh), 12rem);
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.clock .big.long { font-size: clamp(2.8rem, min(21vw, 12vh), 7.5rem); }
@media (orientation: landscape) { .clock .big.long { font-size: clamp(2.6rem, min(9.5vw, 20vh), 7rem) !important; } }
.clock .big small { font-size: 0.42em; font-weight: 500; margin-left: 0.06em; }
.clock .sub { color: var(--ink); opacity: 0.82; font-size: clamp(1.1rem, 4.6vmin, 1.8rem); }

/* Slider */
.slider-wrap { display: grid; gap: 8px; --th: clamp(40px, 9vmin, 64px); --tk: clamp(30px, 6.5vmin, 46px); }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: calc(var(--th) + 8px); margin: 0;
  background: transparent; cursor: pointer;
  touch-action: none;
}
input[type=range]:disabled { cursor: default; }
input[type=range]::-webkit-slider-runnable-track {
  height: var(--tk); border-radius: 999px;
  background: linear-gradient(to right, var(--fill) 0 var(--pct, 33%), var(--track) var(--pct, 33%) 100%);
}
input[type=range]::-moz-range-track { height: var(--tk); border-radius: 999px; background: var(--track); }
input[type=range]::-moz-range-progress { height: var(--tk); border-radius: 999px; background: var(--fill); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: var(--th); height: var(--th); margin-top: calc((var(--tk) - var(--th)) / 2);
  border-radius: 50%; background: #fff;
  border: 4px solid var(--ink);
  box-shadow: 0 3px 10px rgba(0,0,0,0.18);
}
input[type=range]::-moz-range-thumb {
  width: calc(var(--th) - 8px); height: calc(var(--th) - 8px); border-radius: 50%; background: #fff;
  border: 4px solid var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,0.18);
}
input[type=range]:disabled::-webkit-slider-thumb { border-color: var(--ink-soft); }
input[type=range]:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 28px; }
.scale {
  display: flex; justify-content: space-between;
  font-size: clamp(1rem, 4vmin, 1.5rem); font-weight: 700; color: var(--ink); opacity: 0.75;
  font-variant-numeric: tabular-nums; padding: 0 calc(var(--th) / 2 - 0.4em);
}

/* Bottom actions */
.actions { display: grid; gap: clamp(12px, 3vmin, 22px); justify-items: center; }
.start {
  width: 100%; min-height: clamp(64px, 13vmin, 96px);
  border: 0; border-radius: 22px;
  background: var(--btn); color: var(--btn-ink);
  font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 7vmin, 2.6rem);
  cursor: pointer;
}
.start:active { transform: scale(0.98); }
.start:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.options { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: center; font-size: clamp(1rem, 4vmin, 1.4rem); color: var(--ink); }
.options label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.options input { width: 1.2em; height: 1.2em; accent-color: var(--ink); }

.grownup { margin: 0; color: var(--ink); opacity: 0.7; font-size: clamp(0.95rem, 3.6vmin, 1.25rem); text-wrap: balance; }
.clock { -webkit-touch-callout: none; touch-action: none; transition: opacity 0.2s; }

/* Gentle attention pulse */
.glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, var(--glow) 0%, rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.45) 100%);
  opacity: 0;
}
/* Two slow breaths: fade up over ~1.3s, hold briefly, fade down. Starts after the zone color has settled. */
.glow.on { animation: breathe 3s ease-in-out 2; }
.glow.on.after-fade { animation-delay: 3.5s; }
@keyframes breathe { 0%,100% { opacity: 0; } 42%,58% { opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  .glow.on { animation: none; opacity: 0.5; }
}

[hidden] { display: none !important; }
body { margin: 0; }
</style>
</head>
<body>

<div class="glow" id="glow"></div>

<main class="app">
  <section class="status" aria-live="polite">
    <h1 id="title"></h1>
    <p id="note">Slide to pick your time, then press Start.</p>
  </section>

  <section class="clock">
    <div class="big" id="big">1<small>h</small></div>
    <div class="sub" id="sub">&nbsp;</div>
  </section>

  <section class="slider-wrap">
    <input type="range" id="slider" min="0" max="180" step="5" value="60" aria-label="Play time in minutes">
    <div class="scale" aria-hidden="true"><span>0</span><span>1 h</span><span>2 h</span><span>3 h</span></div>
  </section>

  <section class="actions">
    <button class="start" id="start" type="button">Start</button>
    <div class="options" id="options">
      <label><input type="checkbox" id="chime"> Gentle sound</label>
      <label><input type="checkbox" id="cb"> Color-blind colors</label>
    </div>
    <p class="grownup" id="grownup" hidden><span id="holdtext">Grown-up: hold your finger on the time for 5 seconds to reset</span></p>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const slider = $('slider'), startBtn = $('start'), big = $('big'), sub = $('sub');
  const title = $('title'), note = $('note'), glow = $('glow');
  const options = $('options'), grownup = $('grownup');
  const chimeBox = $('chime'), cbBox = $('cb');

  const SHOW_HINT = false;
  const KEY = 'playtimer-v1';
  // Warnings in minutes left. The last one starts the "find a save point" phase.
  const STEPS = [
    { at: 30, title: '30 minutes left', note: 'Still plenty of time. The end is on its way.' },
    { at: 10, title: '10 minutes left', note: 'Start thinking about where you want to stop.' },
    { at: 5,  title: 'Find a save point', note: 'Finish what you are doing and save your game.' },
  ];

  let state = null;   // { start, end, total, speed, fired: [] }
  let tick = null, wakeLock = null, audio = null;

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };

  function fmt(min) {
    const h = Math.floor(min / 60), m = min % 60;
    big.classList.toggle('long', !!(h && m));
    if (h && m) return `${h}<small>h</small> ${m}<small>min</small>`;
    if (h) return `${h}<small>h</small>`;
    return `${m}<small>min</small>`;
  }
  function setPct(v) { slider.style.setProperty('--pct', (v / 180 * 100) + '%'); }
  // Clear zones by minutes left, so the color alone tells you where you are.
  const PALETTES = {
    normal: {
      zones: [
        { above: 30, color: 'hsl(134, 62%, 58%)' },  // green: lots of time
        { above: 10, color: 'hsl(50, 96%, 56%)' },   // yellow: 30 min or less
        { above: 5,  color: 'hsl(36, 96%, 60%)' },   // orange: 10 min or less
        { above: -1, color: 'hsl(26, 92%, 64%)' },   // deeper orange: find a save point
      ],
      done: 'hsl(268, 60%, 74%)',
    },
    // Tested against protan, deutan and tritan simulations: zones differ in blue and brightness, not only red/green.
    cb: {
      zones: [
        { above: 30, color: 'hsl(196, 80%, 46%)' },  // teal-blue: lots of time
        { above: 10, color: 'hsl(52, 100%, 60%)' },  // bright yellow
        { above: 5,  color: 'hsl(30, 100%, 55%)' },  // orange
        { above: -1, color: 'hsl(16, 85%, 52%)' },   // deep red-orange: find a save point
      ],
      done: 'hsl(280, 55%, 86%)',
    },
  };
  const pal = () => cbBox.checked ? PALETTES.cb : PALETTES.normal;
  function colorFor(left) {
    return pal().zones.find(z => left > z.above).color;
  }
  const PREF = 'playtimer-cb';
  try { cbBox.checked = localStorage.getItem(PREF) === '1'; } catch {}
  cbBox.addEventListener('change', () => {
    try { localStorage.setItem(PREF, cbBox.checked ? '1' : '0'); } catch {}
    applyDone();
    if (!state) setField(pal().zones[0].color);
  });
  function applyDone() { document.documentElement.style.setProperty('--done', pal().done); }
  function setField(c) { document.documentElement.style.setProperty('--field', c); }

  // ---------- setup ----------
  function showSetup() {
    document.body.classList.remove('is-done');
    slider.disabled = false; slider.step = '5';
    slider.value = String(Math.max(5, Math.round((Number(slider.value) || 60) / 5) * 5));
    startBtn.hidden = false; options.hidden = false; grownup.hidden = true;
    title.textContent = '';
    note.textContent = 'Slide to pick your time, then press Start.';
    sub.innerHTML = '&nbsp;';
    applyDone();
    setField(pal().zones[0].color);
    onSlide();
  }
  function onSlide() {
    if (state) return;
    let v = Number(slider.value);
    if (v < 5) { v = 5; slider.value = '5'; }
    big.innerHTML = fmt(v);
    setPct(v);
    const end = new Date(Date.now() + v * 60000);
    sub.textContent = 'Ends at ' + end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  slider.addEventListener('input', onSlide);

  // ---------- running ----------
  function begin() {
    const total = Math.max(5, Number(slider.value));
    const speed = 1;
    const now = Date.now();
    state = { start: now, end: now + total * 60000 / speed, total, speed, fired: [], chime: chimeBox.checked, cb: cbBox.checked };
    store.set(state);
    if (state.chime) initAudio();
    run(false);
  }

  function run(resumed) {
    startBtn.hidden = true; options.hidden = true; grownup.hidden = !SHOW_HINT;
    slider.disabled = true; slider.step = 'any';
    // On resume, warnings already passed are marked done without pulsing.
    if (resumed) {
      const left = minutesLeft();
      STEPS.forEach(s => { if (left <= s.at && !state.fired.includes(s.at)) state.fired.push(s.at); });
    }
    const current = [...STEPS].reverse().find(s => state.fired.includes(s.at));
    if (current) { title.textContent = current.title; note.textContent = current.note; }
    else { title.textContent = ''; note.textContent = ''; }
    requestWake();
    clearInterval(tick);
    tick = setInterval(update, 250);
    update();
  }

  function minutesLeft() { return Math.max(0, (state.end - Date.now()) * state.speed / 60000); }

  function update() {
    if (!state) return;
    const left = minutesLeft();
    slider.value = String(left);
    setPct(left);
    setField(colorFor(left));

    const whole = Math.ceil(left);
    if (left > 0 && left < 1) big.classList.remove('long');
    big.innerHTML = left > 0 && left < 1 ? 'Under 1<small>min</small>' : fmt(whole);
    const endAt = new Date(state.start + (state.end - state.start));
    sub.textContent = 'Ends at ' + endAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    for (const s of STEPS) {
      if (state.total > s.at && left <= s.at && !state.fired.includes(s.at)) {
        state.fired.push(s.at); store.set(state);
        title.textContent = s.title; note.textContent = s.note;
        pulse(true);
      }
    }
    if (left <= 0) finish();
  }

  function finish() {
    clearInterval(tick); tick = null;
    releaseWake();
    document.body.classList.add('is-done');
    slider.value = '0'; setPct(0);
    big.classList.remove('long'); big.textContent = 'Done';
    sub.innerHTML = '&nbsp;';
    title.textContent = 'Playtime is over for now';
    note.textContent = 'Your game time is finished. Time for the next thing.';
    grownup.hidden = !SHOW_HINT;
    $('holdtext').textContent = 'Grown-up: hold your finger on the time for 5 seconds for a new timer';
    if (state && state.chime) chime([523.25, 392.0]);
    if (state) { state.finished = true; store.set(state); }
  }

  // ---------- gentle attention ----------
  function pulse(afterFade) {
    glow.classList.remove('on', 'after-fade'); void glow.offsetWidth;
    glow.classList.add('on'); if (afterFade) glow.classList.add('after-fade');
    const ring = () => chime([659.25, 783.99]);
    if (state && state.chime) setTimeout(ring, afterFade ? 3500 : 0);
    else if (!state && chimeBox.checked) { initAudio(); ring(); }
  }
  function initAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { audio = null; }
  }
  function chime(notes) {
    if (!audio) return;
    try {
      notes.forEach((f, i) => {
        const t = audio.currentTime + i * 0.45;
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.12, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        o.connect(g).connect(audio.destination);
        o.start(t); o.stop(t + 1.5);
      });
    } catch {}
  }

  // ---------- keep the screen on ----------
  async function requestWake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch { wakeLock = null; }
  }
  function releaseWake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state && !state.finished) { requestWake(); update(); }
  });

  // ---------- grown-up hold to reset ----------
  // Hidden: hold a finger on the time for 5 seconds. After 2 s the numbers start to fade.
  let holdStart = 0, holdRaf = 0, holding = false;
  const HOLD = 5000, QUIET = 2000;
  const clock = big.parentElement;
  function holdFrame() {
    const t = Date.now() - holdStart;
    if (t > QUIET) clock.style.opacity = String(1 - 0.75 * Math.min(1, (t - QUIET) / (HOLD - QUIET)));
    if (t >= HOLD) { endHold(); reset(); return; }
    holdRaf = requestAnimationFrame(holdFrame);
  }
  function startHold(e) {
    if (!state) return;
    e.preventDefault(); holding = true; holdStart = Date.now();
    cancelAnimationFrame(holdRaf); holdRaf = requestAnimationFrame(holdFrame);
  }
  function endHold() { if (!holding) return; holding = false; cancelAnimationFrame(holdRaf); clock.style.opacity = ''; }
  clock.addEventListener('pointerdown', startHold);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => clock.addEventListener(ev, endHold));
  clock.addEventListener('contextmenu', e => e.preventDefault());

  function reset() {
    clearInterval(tick); tick = null; releaseWake();
    state = null; store.clear();
    glow.classList.remove('on');
    $('holdtext').textContent = 'Grown-up: hold your finger on the time for 5 seconds to reset';
    slider.value = '60';
    showSetup();
  }

  startBtn.addEventListener('click', begin);

  // ---------- resume after reload ----------
  const saved = store.get();
  if (saved && saved.end) {
    state = saved;
    if (typeof saved.cb === 'boolean') cbBox.checked = saved.cb;
    applyDone();
    if (saved.finished || minutesLeft() <= 0) { finish(); }
    else { if (state.chime) chimeBox.checked = true; run(true); }
  } else {
    showSetup();
  }
})();
</script>
</body>
</html>
